name: Feature request
description: Propose a scoped improvement
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, real indexes, private paths, or resource contents."
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: "I have described any JSON contract, CLI, or safety-boundary impact."
          required: true
